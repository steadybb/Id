<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Secure ID Server | Digital Credential</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #e0eafc 0%, #cfdef3 100%);
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .id-card-container {
            max-width: 580px;
            width: 100%;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2));
        }
        .id-card {
            background: #ffffff;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.35);
        }
        .id-header {
            background: #0a2540;
            padding: 1.2rem 1.8rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .badge-title {
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            background: rgba(255,255,255,0.15);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
        }
        .issuer {
            font-size: 0.8rem;
            opacity: 0.85;
            font-family: monospace;
        }
        .id-content {
            padding: 2rem;
        }
        .id-number-section {
            background: #f4f7fc;
            padding: 1rem;
            border-radius: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .id-label {
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-weight: 600;
            color: #2c6e9e;
        }
        .id-number {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            color: #0a2540;
            word-break: break-word;
        }
        .barcode-area {
            background: white;
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-bottom: 2rem;
            text-align: center;
            border: 1px solid #eef3fc;
        }
        .barcode-title {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #5e7f9e;
        }
        canvas#idBarcode {
            background: white;
            padding: 8px;
            border-radius: 16px;
            max-width: 100%;
            height: auto;
        }
        .photo-link-card {
            background: linear-gradient(135deg, #fef9f0, #fff6e8);
            border-radius: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ffe1b3;
        }
        .photo-link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border-radius: 1.3rem;
            padding: 1rem 1.5rem;
            text-decoration: none;
            gap: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .photo-link-btn:hover {
            background: #fffaf2;
            transform: scale(1.01);
            border-color: #ffcd94;
        }
        .link-icon {
            background: #0a2540;
            width: 44px;
            height: 44px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        .link-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1f3f5c;
        }
        .link-sub {
            font-size: 0.7rem;
            color: #7c8f9e;
        }
        .website-footer {
            margin-top: 1.5rem;
            text-align: center;
            border-top: 1px solid #e2edf7;
            padding-top: 1rem;
            font-size: 0.7rem;
            color: #5d768b;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .domain-tag {
            background: #ecf3f9;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-family: monospace;
        }
        @media (max-width: 500px) {
            .id-content { padding: 1.2rem; }
            .id-number { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="id-card-container">
    <div class="id-card">
        <div class="id-header">
            <span class="badge-title">🔐 VERIFIED DIGITAL ID</span>
            <span class="issuer">node • secure</span>
        </div>
        <div class="id-content">
            <!-- ID NUMBER (edit here to change) -->
            <div class="id-number-section">
                <div class="id-label">IDENTIFICATION NUMBER</div>
                <div class="id-number" id="displayIdNumber">1234567890</div>
            </div>

            <!-- BARCODE -->
            <div class="barcode-area">
                <div class="barcode-title">📸 OFFICIAL BARCODE (CODE-128)</div>
                <canvas id="idBarcode"></canvas>
                <div class="barcode-caption" style="font-size:0.7rem; margin-top:0.5rem;">🔍 Scan me – contains ID number</div>
            </div>

            <!-- LINK TO ID PHOTO (static file) -->
            <div class="photo-link-card">
                <a href="/id_photo.jpg" id="photoLink" class="photo-link-btn" target="_blank">
                    <div class="link-icon">📷</div>
                    <div class="link-text">
                        <div class="link-title">View my official ID photo</div>
                        <div class="link-sub">click to open image from static folder</div>
                    </div>
                    <div class="arrow-symbol">➡️</div>
                </a>
            </div>

            <!-- FOOTER with site domain -->
            <div class="website-footer">
                <span>🌐 official portal</span>
                <span class="domain-tag" id="footerDomain">www.yourwebsite.com</span>
            </div>
        </div>
    </div>
    <div style="text-align: center; margin-top: 16px; font-size:0.7rem; color:#3a5d7c;">
        ⚡ Replace your ID photo: <strong>public/id_photo.jpg</strong>
    </div>
</div>

<script>
    // === CONFIGURATION ===
    // Change this to your actual ID number
    const MY_ID_NUMBER = "022026";
    const SITE_DOMAIN   = "www.yourwebsite.com";

    // Update UI
    document.getElementById('displayIdNumber').innerText = MY_ID_NUMBER;
    document.getElementById('footerDomain').innerText = SITE_DOMAIN;

    // Generate barcode
    const canvas = document.getElementById('idBarcode');
    if (canvas && typeof JsBarcode !== 'undefined') {
        JsBarcode(canvas, MY_ID_NUMBER, {
            format: "CODE128",
            width: 2.2,
            height: 70,
            displayValue: true,
            fontSize: 14,
            font: "monospace",
            textMargin: 6,
            margin: 10,
            background: "#ffffff",
            lineColor: "#0a2540"
        });
    }
</script>
</body>
</html>
